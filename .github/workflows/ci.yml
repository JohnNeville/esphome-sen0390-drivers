# Validates and compiles the component on every change.
#
# `esphome config` catches schema and codegen errors; `esphome compile` walks every C++ path
# the schema can generate, which is why the test YAML sets every option.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - run: esphome config tests/test-dfrobot_sen0390.yaml

  compile:
    name: esphome compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: esphome-toolchain-${{ runner.os }}
      - run: pip install esphome
      - run: esphome compile tests/test-dfrobot_sen0390.yaml
